# OPT-IN profile: in-memory H2, for starting the API with no dependencies at all.
#
#     ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
#
# Use this only when Docker is unavailable. It is NOT the development default any more,
# because H2 and PostgreSQL disagree on enough SQL that a migration can pass here and
# fail in production — and the database is wiped on every restart, so seeded data does
# not survive.

spring:
  datasource:
    url: jdbc:h2:mem:ibanking;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      # An unauthenticated SQL shell. It stays off.
      enabled: false

server:
  servlet:
    session:
      cookie:
        # Plain http on localhost, so a secure-only cookie would never be sent.
        secure: false

ibanking:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173

logging:
  level:
    org.springframework.security: DEBUG
