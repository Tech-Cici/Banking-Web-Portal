# Base configuration shared by every profile.
# Nothing environment-specific or secret belongs in this file. Secrets come from the
# environment (or the bank's secret manager) and are referenced as ${VAR} below.

spring:
  # Optional local overrides, git-ignored.
  #
  # `optional:` means a missing file is not an error, so this is inert on any machine
  # and in every deployed environment — where the values come from the environment or
  # the bank's secret manager instead. The `[.properties]` hint tells Boot to read the
  # extension-less file as KEY=VALUE lines.
  #
  # It exists so a developer can paste a credential into backend/.env and run the
  # service, rather than remembering to export it in every new shell. Nothing in .env
  # is ever committed; see backend/.env.example for the template.
  config:
    import: optional:file:./.env[.properties]

  application:
    name: ibanking-api

  profiles:
    # Local development default. Override with SPRING_PROFILES_ACTIVE in every deployed
    # environment.
    default: dev

  jpa:
    # Lazy loading outside a transaction is a source of N+1 queries and surprise
    # LazyInitializationExceptions in the web layer. Entities must never reach a controller.
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway migrations, never by Hibernate. This stays 'none' in
      # every environment including tests.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # ---------------------------------------------------------------- sessions
  #
  # WHERE A SESSION LIVES. In the database, not in Tomcat's memory.
  #
  # WHAT THIS FIXES: every restart of this service used to sign every customer out, so
  # reloading any page landed them on the sign-in form. It was reported as "reloading signs
  # me out" and that was exactly what happened. It also made more than one instance
  # impossible — two nodes cannot share an in-memory session — and made every deploy an
  # involuntary sign-out for everybody using the portal at the time.
  session:
    store-type: jdbc
    jdbc:
      # FLYWAY OWNS THE SCHEMA (V21), not the library. `always` would have Spring Session
      # create these tables on start-up, which is the same mistake as letting Hibernate
      # create the rest: a schema that differs between environments and has no version
      # anybody can name. The house rule is ddl-auto: none everywhere, and this is that
      # rule applied to the one table a library would otherwise bring with it.
      initialize-schema: never

  flyway:
    # V1__onboarding.sql exists, so migrations now run. The schema is owned here and
    # never by Hibernate (ddl-auto stays 'none' in every environment, tests included) —
    # a schema Hibernate invents locally is a schema that differs from production.
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    # Instants as ISO-8601 strings, not epoch numbers: the client parses one format only.
    # Jackson 3 (Boot 4) moved this out of SerializationFeature into DateTimeFeature, and
    # already defaults it to false. Pinned explicitly so a future default cannot silently
    # change the wire format the front end parses.
    datatype:
      datetime:
        write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # SMTP transport.
  #
  # Every value here is either a non-secret default or an environment reference. The
  # password has NO default on purpose: an empty string is the honest representation of
  # "not configured", and it is what the enabled-check below looks for.
  #
  # Gmail note: `MAIL_USERNAME` is the full address and `MAIL_PASSWORD` is a Google App
  # Password, not the account password — Google stopped accepting account passwords from
  # third-party SMTP clients. An App Password requires 2-Step Verification on the
  # account and is created at https://myaccount.google.com/apppasswords
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          # STARTTLS required, not merely enabled. `enable` alone will happily continue
          # in plaintext if the server does not offer TLS, which would put a verification
          # code and the SMTP password on the wire in the clear.
          starttls:
            enable: true
            required: true
          # Fail fast rather than holding a request thread open on an unreachable relay.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      # This service is an API. It serves no static content; the SPA is hosted separately.
      add-mappings: false

server:
  port: ${SERVER_PORT:8080}
  error:
    # The custom error envelope is the only error surface. Suppress Boot's default fields so
    # a stack trace can never leak through the container's error page.
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: strict

      # HOW LONG A SESSION SURVIVES WITHOUT ACTIVITY.
      #
      # SET EXPLICITLY, where it was inherited before. The default is also thirty minutes,
      # so this changes nothing today — the point is that the number is now visible and
      # reviewable instead of being a framework default nobody had decided on. It is the
      # single value that decides how often a customer is asked to sign in again.
      #
      # THIRTY MINUTES IS NOT A BANKING DECISION ANYBODY HAS TAKEN. Shorter is the usual
      # advice for a service holding money, and a warning before the session drops is
      # better than either number on its own. Both belong to the bank; docs/OPEN-ITEMS.md
      # records them rather than this file quietly choosing.
      timeout: 30m
  # Do not advertise the server implementation.
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto

management:
  health:
    mail:
      # OFF, deliberately.
      #
      # Boot adds a mail health indicator that opens an SMTP connection every time
      # /actuator/health is probed. Liveness and readiness probes hit that endpoint every
      # few seconds, so with a real relay behind it the service would open thousands of
      # SMTP connections a day purely to ask whether it could — and a consumer provider
      # will throttle or block for exactly that. It also means an unrelated SMTP hiccup
      # would report the whole API as unhealthy and take it out of the load balancer.
      #
      # Whether mail is configured is reported once at startup by MailStartupCheck, which
      # is where that belongs.
      enabled: false

  endpoints:
    web:
      exposure:
        # Only health is exposed. Adding 'env', 'configprops' or 'heapdump' to a banking
        # service would publish configuration and memory contents.
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      # Never reveal which dependency is failing to an unauthenticated caller.
      show-details: never
      show-components: never

ibanking:
  sign-in:
    # WHETHER A CUSTOMER MUST TYPE AN EMAILED CODE TO SIGN IN.
    #
    # False: a password is enough. The bank asked for the code to stop, because it was
    # asked for on EVERY sign-in and a customer checking their balance twice in a morning
    # read two emails and typed two codes.
    #
    # The middle option was built first and is still here: keep the code and remember the
    # browser for thirty days (see TrustedDevices, still tested). It is off because it did
    # not survive real use — several accounts in one browser share one cookie, so every
    # switch between two accounts asked for a code again.
    #
    # WHAT THIS COSTS, so nobody has to read the code to find out: with this false, a
    # leaked password is enough to reach somebody's money from anywhere. Nothing else is
    # in the way. Fine for a portal being built and shown; not fine for real customers.
    # Set LOGIN_CODE_REQUIRED=true to turn it back on. See frontend/docs/OPEN-ITEMS.md.
    code-required: ${LOGIN_CODE_REQUIRED:false}

  mail:
    # Master switch. Left false so that adding the dependency changed no behaviour:
    # nothing is sent until someone deliberately turns it on for an environment.
    enabled: ${MAIL_ENABLED:false}

    # The address customers see in the From field. A sender is not a secret — it is on
    # every message the bank sends — so it lives in configuration rather than the
    # environment, and each environment may override it.
    #
    # NOT a production value. A gmail.com address cannot carry Zigama's SPF, DKIM or
    # DMARC records, because Google controls that domain; the bank's mail can therefore
    # never be authenticated as the bank's. Production needs an address on a domain the
    # bank controls. See frontend/docs/OPEN-ITEMS.md.
    from: ${MAIL_FROM:ciaramuzora@gmail.com}

    # What the From line reads as, next to the address.
    from-name: ${MAIL_FROM_NAME:Ciara's demo}

    # How long a verification code stays valid. Short: a code that lives for an hour is
    # an hour in which a forwarded email is still a working credential.
    code-validity: ${MAIL_CODE_VALIDITY:PT10M}

    # BREVO: SEND OVER HTTPS INSTEAD OF SMTP.
    #
    # Why this exists: some hosts do not allow outbound traffic to SMTP ports at all.
    # Render's free web services are one — a connection to smtp.gmail.com:587 cannot leave
    # the container, whatever the credentials, and every verification code is recorded
    # undelivered. Brevo's transactional endpoint is ordinary HTTPS on 443.
    #
    # Note that Brevo ALSO offers an SMTP relay, and that would be blocked exactly as
    # Gmail's is. This is the HTTP API, which is a different thing despite the endpoint
    # path containing the word "smtp".
    #
    # With this true, every spring.mail.* setting above is ignored.
    #
    # BEFORE IT WORKS: the address in `from` above must be a verified sender in the Brevo
    # account (Senders, domains & dedicated IPs). Brevo answers 400 for an unverified
    # sender, which reads like a malformed request rather than a permission problem.
    brevo:
      enabled: ${BREVO_ENABLED:false}

      # Sent in the `api-key` header. A SECRET: it can send mail as this account to
      # anyone. Supplied through the environment, never committed, never logged — the
      # code only ever asks whether it is blank.
      api-key: ${BREVO_API_KEY:}

      # A customer is watching a spinner while this call is in flight, so it is short.
      # A send that has not answered by now is better recorded as failed: the outbox keeps
      # the body, so the code is still readable from the staff message log.
      timeout: ${BREVO_TIMEOUT:PT10S}

  cors:
    # Exact origins only. Populated per environment; see application-dev.yml.
    allowed-origins: []
    allow-credentials: true

logging:
  pattern:
    # %X{correlationId} ties every log line to the id returned in the error envelope.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{correlationId:-no-correlation-id}] %-40.40logger{39} : %m%n"
  level:
    root: INFO
    rw.bank.ibanking: DEBUG
