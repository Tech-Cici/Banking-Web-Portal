# Base configuration shared by every profile.
# Nothing environment-specific or secret belongs in this file. Secrets come from the
# environment (or the bank's secret manager) and are referenced as ${VAR} below.

spring:
  # Optional local overrides, git-ignored.
  #
  # `optional:` means a missing file is not an error, so this is inert on any machine
  # and in every deployed environment — where the values come from the environment or
  # the bank's secret manager instead. The `[.properties]` hint tells Boot to read the
  # extension-less file as KEY=VALUE lines.
  #
  # It exists so a developer can paste a credential into backend/.env and run the
  # service, rather than remembering to export it in every new shell. Nothing in .env
  # is ever committed; see backend/.env.example for the template.
  config:
    import: optional:file:./.env[.properties]

  application:
    name: ibanking-api

  profiles:
    # Local development default. Override with SPRING_PROFILES_ACTIVE in every deployed
    # environment.
    default: dev

  jpa:
    # Lazy loading outside a transaction is a source of N+1 queries and surprise
    # LazyInitializationExceptions in the web layer. Entities must never reach a controller.
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway migrations, never by Hibernate. This stays 'none' in
      # every environment including tests.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # ---------------------------------------------------------------- sessions
  #
  # WHERE A SESSION LIVES. In the database, not in Tomcat's memory.
  #
  # WHAT THIS FIXES: every restart of this service used to sign every customer out, so
  # reloading any page landed them on the sign-in form. It was reported as "reloading signs
  # me out" and that was exactly what happened. It also made more than one instance
  # impossible — two nodes cannot share an in-memory session — and made every deploy an
  # involuntary sign-out for everybody using the portal at the time.
  session:
    store-type: jdbc
    jdbc:
      # FLYWAY OWNS THE SCHEMA (V21), not the library. `always` would have Spring Session
      # create these tables on start-up, which is the same mistake as letting Hibernate
      # create the rest: a schema that differs between environments and has no version
      # anybody can name. The house rule is ddl-auto: none everywhere, and this is that
      # rule applied to the one table a library would otherwise bring with it.
      initialize-schema: never

  flyway:
    # V1__onboarding.sql exists, so migrations now run. The schema is owned here and
    # never by Hibernate (ddl-auto stays 'none' in every environment, tests included) —
    # a schema Hibernate invents locally is a schema that differs from production.
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    # Instants as ISO-8601 strings, not epoch numbers: the client parses one format only.
    # Jackson 3 (Boot 4) moved this out of SerializationFeature into DateTimeFeature, and
    # already defaults it to false. Pinned explicitly so a future default cannot silently
    # change the wire format the front end parses.
    datatype:
      datetime:
        write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # SMTP transport.
  #
  # Every value here is either a non-secret default or an environment reference. The
  # password has NO default on purpose: an empty string is the honest representation of
  # "not configured", and it is what the enabled-check below looks for.
  #
  # Gmail note: `MAIL_USERNAME` is the full address and `MAIL_PASSWORD` is a Google App
  # Password, not the account password — Google stopped accepting account passwords from
  # third-party SMTP clients. An App Password requires 2-Step Verification on the
  # account and is created at https://myaccount.google.com/apppasswords
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          # STARTTLS required, not merely enabled. `enable` alone will happily continue
          # in plaintext if the server does not offer TLS, which would put a verification
          # code and the SMTP password on the wire in the clear.
          starttls:
            enable: true
            required: true
          # Fail fast rather than holding a request thread open on an unreachable relay.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      # This service is an API. It serves no static content; the SPA is hosted separately.
      add-mappings: false

server:
  port: ${SERVER_PORT:8080}
  error:
    # The custom error envelope is the only error surface. Suppress Boot's default fields so
    # a stack trace can never leak through the container's error page.
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  servlet:
    # ---- UPLOADED FILES.
    #
    # Boot's default is 1 MB per file, which a photograph of an A4 page exceeds without
    # trying. The ceiling here is the same 8 MB the collateral_documents CHECK enforces and
    # that OcrProperties clamps to: three copies of one number, in the three places that can
    # refuse an upload, and they have to agree or a file gets past one and is rejected by the
    # next with a message about a constraint.
    #
    # The request limit is larger than the file limit because a multipart request carries the
    # field values and the boundaries as well as the file itself.
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB
    session:
      cookie:
        http-only: true
        secure: true
        same-site: strict

      # HOW LONG A SESSION SURVIVES WITHOUT ACTIVITY.
      #
      # SET EXPLICITLY, where it was inherited before. The default is also thirty minutes,
      # so this changes nothing today — the point is that the number is now visible and
      # reviewable instead of being a framework default nobody had decided on. It is the
      # single value that decides how often a customer is asked to sign in again.
      #
      # THIRTY MINUTES IS NOT A BANKING DECISION ANYBODY HAS TAKEN. Shorter is the usual
      # advice for a service holding money, and a warning before the session drops is
      # better than either number on its own. Both belong to the bank; docs/OPEN-ITEMS.md
      # records them rather than this file quietly choosing.
      timeout: 30m
  # Do not advertise the server implementation.
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto

management:
  health:
    mail:
      # OFF, deliberately.
      #
      # Boot adds a mail health indicator that opens an SMTP connection every time
      # /actuator/health is probed. Liveness and readiness probes hit that endpoint every
      # few seconds, so with a real relay behind it the service would open thousands of
      # SMTP connections a day purely to ask whether it could — and a consumer provider
      # will throttle or block for exactly that. It also means an unrelated SMTP hiccup
      # would report the whole API as unhealthy and take it out of the load balancer.
      #
      # Whether mail is configured is reported once at startup by MailStartupCheck, which
      # is where that belongs.
      enabled: false

  endpoints:
    web:
      exposure:
        # Only health is exposed. Adding 'env', 'configprops' or 'heapdump' to a banking
        # service would publish configuration and memory contents.
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      # Never reveal which dependency is failing to an unauthenticated caller.
      show-details: never
      show-components: never

ibanking:
  # ---- WHAT A STATEMENT CALLS THE INSTITUTION THAT ISSUED IT.
  #
  # THE DEMONSTRATION NAME IS THE DEFAULT, for the same reason frontend/src/config/brand.ts
  # defaults to it. A statement is a document that leaves the portal -- downloaded, forwarded,
  # printed, attached to a rental application. A PDF carrying a real bank's name, laid out
  # like that bank's statement and listing plausible transactions, is a fabricated financial
  # record the moment it leaves this machine, whatever it was built for.
  #
  # A real deployment by the bank that actually issues these sets STATEMENT_BRAND_NAME
  # deliberately. That is a decision made once in an environment somebody controls, not one a
  # build inherits by forgetting.
  statements:
    brand-name: ${STATEMENT_BRAND_NAME:Ciara's demo - Internet Banking}

  # ---- HOW OFTEN THE STANDING-ORDER SWEEP RUNS.
  #
  # Hourly by default, because nothing in production is due at finer resolution than a day
  # and sweeping more often is work with no payment at the end of it. The startup sweep is
  # what actually matters on a host that sleeps; this timer covers the hours it is awake.
  #
  # DEVELOPMENT SETS IT TO SECONDS so the EVERY_2_MINUTES frequency can be watched. Standing
  # orders are the only way money leaves an account here without a manager releasing it, and
  # that is worth seeing happen rather than trusting. See application-dev.yml.
  standing-orders:
    sweep-interval-ms: ${STANDING_ORDER_SWEEP_MS:3600000}

  sign-in:
    # WHETHER A CUSTOMER MUST TYPE AN EMAILED CODE TO SIGN IN.
    #
    # False: a password is enough. The bank asked for the code to stop, because it was
    # asked for on EVERY sign-in and a customer checking their balance twice in a morning
    # read two emails and typed two codes.
    #
    # The middle option was built first and is still here: keep the code and remember the
    # browser for thirty days (see TrustedDevices, still tested). It is off because it did
    # not survive real use — several accounts in one browser share one cookie, so every
    # switch between two accounts asked for a code again.
    #
    # WHAT THIS COSTS, so nobody has to read the code to find out: with this false, a
    # leaked password is enough to reach somebody's money from anywhere. Nothing else is
    # in the way. Fine for a portal being built and shown; not fine for real customers.
    # Set LOGIN_CODE_REQUIRED=true to turn it back on. See frontend/docs/OPEN-ITEMS.md.
    code-required: ${LOGIN_CODE_REQUIRED:false}

  # ---- LOAN PRODUCTS AND THEIR RATES.
  #
  # PROVISIONAL, AND LABELLED AS SUCH. These are working values in the same sense as the
  # 10-16 digit account-number rule and the demonstration MAIL_FROM: enough to build and
  # show the screens, and wrong until Zigama confirms them. docs/OPEN-ITEMS.md tracks it.
  #
  # THEY DRIVE ONLY THE SIMULATION, which is an indicative answer to "what would this
  # cost" and is never stored. A loan the bank has actually granted carries ITS OWN rate,
  # typed in by staff, because a customer's agreed rate can differ from the advertised one.
  #
  # The three codes match the three the screen offers. A product not listed here is
  # refused rather than given a default: a default rate is a quote nobody gave.
  loans:
    # ---- THE MOST ONE CUSTOMER MAY OWE AT ONCE, across every loan, in francs.
    #
    # This is what decides whether somebody repaying a loan may take another: what they still
    # owe, plus what they are asking for, has to stay under this. A loan that is fully paid
    # has nothing outstanding, so it adds nothing and stops blocking on its own -- there is no
    # separate rule about settled loans anywhere, which is the point of using a sum.
    #
    # PROVISIONAL, like every other figure here. A Rwandan bank was reported lending up to
    # RWF 30,000,000 unsecured to one customer, so a total ceiling somewhat above that is the
    # shape of the thing; the number itself belongs to Zigama's credit committee.
    #
    # Leave it unset and the gate is off: a bank that has named no ceiling has not decided on
    # one, and refusing everybody because a number is missing would be software writing credit
    # policy by omission.
    max-total-exposure-rwf: ${MAX_TOTAL_EXPOSURE_RWF:20000000}

    products:
      #
      # WHETHER A PRODUCT NEEDS SECURITY. Three rules: NEVER, ABOVE_THRESHOLD with a figure in
      # francs, ALWAYS. A product configured inconsistently -- a threshold rule with no figure,
      # or a figure under a rule that ignores it -- stops the application starting, because
      # every other outcome is the bank lending unsecured on a missing number.
      #
      # THE FIGURES BELOW ARE PROVISIONAL, exactly like the rates above them, and the personal
      # one is provisional TWICE OVER. It is a published US retail-credit band -- the $5,000
      # line under which collateral is rarely asked for -- converted at 1 USD = 1,450 RWF,
      # which is itself the provisional rate seeded by migration V32. A figure derived from a
      # foreign market's convention through a rate nobody has confirmed is a placeholder with
      # arithmetic in front of it, not a policy, and it is written down here so that nobody
      # mistakes its precision for authority.
      #
      # IT IS THE CONSERVATIVE END OF THAT MODEL, deliberately. The US bands put $5,000 to
      # $50,000 in a gray area resolved by the borrower's credit score, and this portal holds
      # no score, no bureau data and no history beyond what it recorded itself. Where the
      # model says "it depends on creditworthiness you cannot see", the safe reading is to
      # ask for security rather than to assume the borrower is good for it. For context, a
      # Rwandan bank was reported lending up to RWF 30,000,000 unsecured, so this sits well
      # inside local practice.
      #
      # WHAT WOULD REPLACE IT PROPERLY is a figure from Zigama's credit committee, and most
      # likely a different shape: a salary-backed lender tends to express an unsecured limit
      # as a multiple of salary rather than a flat amount, which this portal cannot do today
      # because it holds no salary figure.
      #
      # ONLY FRANCS CARRY A FIGURE. A loan in any other currency requires security whatever the
      # amount: comparing a dollar amount against a franc threshold needs an exchange rate this
      # portal does not have, and the safe direction to err is towards asking.
      - code: PERSONAL
        name: Personal loan
        annual-rate-percent: 16.0
        min-months: 6
        max-months: 60
        collateral: ABOVE_THRESHOLD
        collateral-required-above-rwf: 7250000
      - code: SALARY_ADVANCE
        name: Salary advance
        annual-rate-percent: 12.0
        min-months: 6
        max-months: 24
        # Secured by the salary it is advanced against, so nothing is pledged.
        collateral: NEVER
      - code: BUSINESS
        name: Business loan
        annual-rate-percent: 18.0
        min-months: 12
        max-months: 60
        collateral: ALWAYS

  # ---------------------------------------------------------------- registration
  #
  # WHETHER AN APPLICANT MUST PROVE THEY CAN READ THE ADDRESS THEY GAVE.
  #
  # ON, by email, and the reason is the manager's message rather than the applicant's
  # patience. The credentials a manager sends after approving go to the address on the
  # application and nowhere else -- the CBS record carries a telephone number and no
  # email address, so nothing downstream can catch a mistyped one. Proving the applicant
  # can read that address is what makes the approval email arrive.
  #
  # Verification was briefly switched off here while the plan was to move it to SMS. It
  # is back on because the email has a job to do that SMS would not replace. If SMS is
  # funded later, the flag stays and the transport changes beneath it.
  registration:
    verify-contact: ${REGISTRATION_VERIFY_CONTACT:true}

  # ------------------------------------------------------- core banking system
  #
  # The bank's own system of record, on SQL Server. This service READS it and never
  # writes: the login below should hold SELECT and nothing else, and the pool is opened
  # read-only so the driver refuses a write even if one were written by mistake.
  #
  # OFF BY DEFAULT so that a developer with no SQL Server running still gets an
  # application that starts. Lookups then report the CBS as unavailable, which is true,
  # rather than the service failing to boot over a system it only reads from.
  #
  # trustServerCertificate is set because the local container serves a self-signed
  # certificate. That is a LOCAL accommodation: a real CBS connection gets a real
  # certificate, and this value does not travel to one.
  cbs:
    enabled: ${CBS_ENABLED:false}
    url: ${CBS_URL:jdbc:sqlserver://localhost:1433;databaseName=ZigamaCbs;encrypt=true;trustServerCertificate=true}
    username: ${CBS_USERNAME:sa}
    password: ${CBS_PASSWORD:}

  mail:
    # Master switch. Left false so that adding the dependency changed no behaviour:
    # nothing is sent until someone deliberately turns it on for an environment.
    enabled: ${MAIL_ENABLED:false}

    # The address customers see in the From field. A sender is not a secret — it is on
    # every message the bank sends — so it lives in configuration rather than the
    # environment, and each environment may override it.
    #
    # NOT a production value. A gmail.com address cannot carry Zigama's SPF, DKIM or
    # DMARC records, because Google controls that domain; the bank's mail can therefore
    # never be authenticated as the bank's. Production needs an address on a domain the
    # bank controls. See frontend/docs/OPEN-ITEMS.md.
    from: ${MAIL_FROM:ciaramuzora@gmail.com}

    # What the From line reads as, next to the address.
    from-name: ${MAIL_FROM_NAME:Ciara's demo}

    # How long a verification code stays valid. Short: a code that lives for an hour is
    # an hour in which a forwarded email is still a working credential.
    code-validity: ${MAIL_CODE_VALIDITY:PT10M}

    # BREVO: SEND OVER HTTPS INSTEAD OF SMTP.
    #
    # Why this exists: some hosts do not allow outbound traffic to SMTP ports at all.
    # Render's free web services are one — a connection to smtp.gmail.com:587 cannot leave
    # the container, whatever the credentials, and every verification code is recorded
    # undelivered. Brevo's transactional endpoint is ordinary HTTPS on 443.
    #
    # Note that Brevo ALSO offers an SMTP relay, and that would be blocked exactly as
    # Gmail's is. This is the HTTP API, which is a different thing despite the endpoint
    # path containing the word "smtp".
    #
    # With this true, every spring.mail.* setting above is ignored.
    #
    # BEFORE IT WORKS: the address in `from` above must be a verified sender in the Brevo
    # account (Senders, domains & dedicated IPs). Brevo answers 400 for an unverified
    # sender, which reads like a malformed request rather than a permission problem.
    brevo:
      enabled: ${BREVO_ENABLED:false}

      # Sent in the `api-key` header. A SECRET: it can send mail as this account to
      # anyone. Supplied through the environment, never committed, never logged — the
      # code only ever asks whether it is blank.
      api-key: ${BREVO_API_KEY:}

      # A customer is watching a spinner while this call is in flight, so it is short.
      # A send that has not answered by now is better recorded as failed: the outbox keeps
      # the body, so the code is still readable from the staff message log.
      timeout: ${BREVO_TIMEOUT:PT10S}

  # ---- READING UPLOADED DOCUMENTS.
  #
  # The binary is configuration because tesseract lands in /opt/homebrew/bin on a Mac and
  # /usr/bin in a container, and a hard-coded path is a feature that works on one machine.
  #
  # LANGUAGES: naming one whose training data is not installed makes tesseract exit rather
  # than fall back, so this stays at eng until `tesseract --list-langs` says otherwise.
  #
  # NOTHING HERE IS REQUIRED FOR THE PORTAL TO RUN. With no tesseract on the machine, uploads
  # still succeed, the reading comes back FAILED, and the customer types the fields.
  ocr:
    binary: ${OCR_BINARY:tesseract}
    languages: ${OCR_LANGUAGES:eng}
    timeout: ${OCR_TIMEOUT:PT30S}
    max-pages: ${OCR_MAX_PAGES:3}
    max-bytes: 8388608

  cors:
    # Exact origins only. Populated per environment; see application-dev.yml.
    allowed-origins: []
    allow-credentials: true

logging:
  pattern:
    # %X{correlationId} ties every log line to the id returned in the error envelope.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{correlationId:-no-correlation-id}] %-40.40logger{39} : %m%n"
  level:
    root: INFO
    rw.bank.ibanking: DEBUG
