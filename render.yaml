# Render service definition for the API.
#
# THE FRONTEND IS NOT HERE. It deploys to Vercel from frontend/, and the database is Neon.
# See frontend/DEPLOY.md for the whole picture and the order to do it in.
#
# EVERY SECRET IS `sync: false`, which means Render asks for it in the dashboard rather than
# reading it from this file. A connection string or a bootstrap password committed to a
# repository is a credential in every clone and every fork of it.

services:
  - type: web
    name: zigama-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt
    # /actuator/health, NOT /api/v1/actuator/health. Actuator has no custom base-path and
    # the app has no servlet context-path, so the API's /api/v1 prefix does not apply to it.
    # Verified against the running service: this path answers 200 unauthenticated, while
    # /api/v1/... answers 401 — which Render reads as unhealthy and restart-loops on.
    healthCheckPath: /actuator/health

    envVars:
      # `demo`, not `postgres` and emphatically not `dev`. The demo profile keeps the
      # development staff seeder out (its password is in this repository) and keeps the
      # start-over endpoint refused, because DevResetController only permits dev, h2 and
      # test. See backend/src/main/resources/application-demo.yml.
      - key: SPRING_PROFILES_ACTIVE
        value: demo

      # ---- Neon. Note DB_URL must be a jdbc: URL with the credentials taken out.
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      # ---- the browser app's exact origin, scheme and host, no trailing slash.
      # The API refuses browser requests from an origin it has not been told about, so this
      # is set AFTER Vercel exists and is the step most likely to be forgotten.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # ---- `none` while the frontend and API are on unrelated hosts, because a Strict
      # cookie is not sent cross-site and the symptom is signing in and being signed
      # straight out. Put both behind one domain and set this back to `strict`;
      # application-demo.yml has the full reasoning.
      - key: SESSION_COOKIE_SAME_SITE
        value: none

      # ---- the first two staff logins. Without these nobody can sign into /staff, which
      # means no account can be created or approved and the portal does nothing. The two
      # addresses must differ.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_MANAGER_EMAIL
        sync: false
      - key: BOOTSTRAP_MANAGER_PASSWORD
        sync: false

      # ---- mail, OVER HTTPS AND NOT SMTP, and that is forced rather than preferred.
      #
      # RENDER'S FREE WEB SERVICES DO NOT ALLOW OUTBOUND TRAFFIC TO SMTP PORTS. This was
      # found the hard way: with MAIL_HOST=smtp.gmail.com and a valid 16-character App
      # Password, the first registration on this deployment recorded
      #
      #     EMAIL_VERIFICATION | delivered: f
      #     failure: The mail server rejected or could not be reached.
      #
      # No credential could have fixed that — the connection never left the container.
      # Brevo's transactional endpoint is ordinary HTTPS on 443, which is not blocked.
      #
      # Note that Brevo ALSO offers an SMTP relay on 587. That would be blocked exactly as
      # Gmail's is. BREVO_ENABLED selects the HTTP API, which is a different thing despite
      # the endpoint path containing the word "smtp".
      #
      # The spring.mail.* settings are deliberately absent below: with BREVO_ENABLED true
      # they are ignored entirely, and leaving them would invite somebody to spend an hour
      # on an App Password that is never read.
      - key: MAIL_ENABLED
        value: "true"
      - key: BREVO_ENABLED
        value: "true"

      # The xkeysib-… key from app.brevo.com → SMTP & API → API keys. A SECRET: it can send
      # mail as that account to anyone.
      - key: BREVO_API_KEY
        sync: false

      # ---- the From address customers see.
      #
      # BREVO REFUSES ANY SENDER IT HAS NOT VERIFIED, and answers 400 — which reads like a
      # malformed request rather than a permission problem. Add this exact address under
      # Senders, domains & dedicated IPs in Brevo and confirm the email it sends you, BEFORE
      # the first registration.
      #
      # A consumer mailbox cannot carry the bank's SPF, DKIM or DMARC records, so this is a
      # demonstration value: production needs an address on a domain the bank controls.
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: Zigama CSS
